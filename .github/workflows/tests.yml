name: Tests

on:
  schedule:
    - cron: '0 0 * * SUN'
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git checkout ${{ env.BRANCH }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: prettier
        run: pnpm exec prettier . --check

      - name: flowjs
        run: pnpm exec flow check

      - name: eslint
        run: pnpm exec eslint --color .

      - name: Run Tests
        run: pnpm test
